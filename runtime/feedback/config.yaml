# 用户反馈处理模块配置

# 是否启用反馈处理模块
enabled: true

# 扫描间隔（分钟）
interval_minutes: 30

# Agent 配置
agent_id: "alpha"
model: "openrouter/openrouter/hunter-alpha"

# 目录配置
feedback_new_dir: "workspace/feedback/new"    # 待处理反馈
feedback_done_dir: "workspace/feedback/done"  # 已处理反馈

# 消息推送配置
delivery:
  recipients:
    - name: "Momojie"
      agent_id: "notify"
      channel: "wecom"

# Cron 任务配置
cron:
  # 轮询 session store 的超时时间（秒）
  session_poll_timeout_seconds: 300

  # 等待 decision 字段的超时时间（秒）
  result_wait_timeout_seconds: 600
