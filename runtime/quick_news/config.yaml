enabled: true
interval_minutes: 30

# 负责分析的 agent（Gateway 默认 agent）
agent_id: main

# 模型覆盖（可选），不填则使用默认模型
model: openrouter/nvidia/nemotron-3-super-120b-a12b:free

delivery:
  recipients:
    - name: Momojie
      agent_id: notify
      channel: wecom

# Cron 任务配置
cron:
  # Agent 执行超时（秒），实测单条 ~13 分钟
  agent_turn_timeout_seconds: 900

  # 轮询 Gateway cron job 完成状态的超时（秒）
  session_poll_timeout_seconds: 900
